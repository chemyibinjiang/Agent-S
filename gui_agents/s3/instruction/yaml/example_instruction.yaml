# Safe-runner friendly example:
# - expected_result uses literal UI text that OCR can match
# - retry: -1 means keep polling until timeout_sec instead of checking only once
name: "EndNote FindFullText Instruction"
metadata:
  title: "EndNote 使用指南：FindFullText 功能入门"
  software:
    name: "EndNote"
    version: "2024"
  language: "zh-CN"
  source_markdown: "../example_instruction.md"
  author: null
  updated_at: null

on:
  workflow_dispatch:

jobs:
  instruction_flow:
    name: "FindFullText 操作流程"
    runs-on: "human-desktop"
    steps:
      - id: step_1_open_app
        name: "步骤1：打开 EndNote"
        description: "打开 EndNote 软件，进入主界面。"
        action:
          - "双击桌面上的 EndNote 图标"
          - "或者通过开始菜单搜索并打开 EndNote"
        actions: null
        images:
          step_image: null
          result_image: "../../agents/test_images/step1.png"
        element_text: null
        on_success: "step_2_click_references"
        expected_result: "All References"
        timeout_sec: 120
        retry: -1

      - id: step_2_click_references
        name: "步骤2：点击References菜单"
        description: "在顶部菜单栏中点击 References。"
        action:
          - "点击顶部菜单栏中的 References"
        actions:
          mouse_input:
            - button: "left"
              action: "click"
              clicks: 1
              duration_ms: 0
              position: null
              target: "References 菜单"
              modifiers: []
          key_input: []
          text_input: []
          scroll_input: []
          drag_drop: []
          hover_input: []
          window_input: []
          file_input: []
          clipboard_input: []
          wait: []
          special: []
        images:
          step_image: "../../agents/test_images/step2.png"
          result_image: "../../agents/test_images/step2_r.png"
        template_matching:
          min_scale: 0.9
          max_scale: 1.1
          scale_step: 0.05
        element_text: "References"
        on_success: "step_3_find_full_text"
        expected_result: "Find Full Text"
        timeout_sec: 120
        retry: -1

      - id: step_3_find_full_text
        name: "步骤3：在下拉菜单中选择 Find Full Text"
        description: "在 References 下拉菜单中选择 Find Full Text。"
        action:
          - "在下拉菜单中点击 Find Full Text"
          - "在子菜单中再次选择 Find Full Text"
        actions:
          mouse_input:
            - button: "left"
              action: "click"
              clicks: 1
              duration_ms: 0
              position: null
              target: "Find Full Text 菜单项"
              modifiers: []
            - button: "left"
              action: "click"
              clicks: 1
              duration_ms: 0
              position: null
              target: "Find Full Text 子菜单项"
              modifiers: []
          key_input: []
          text_input: []
          scroll_input: []
          drag_drop: []
          hover_input: []
          window_input: []
          file_input: []
          clipboard_input: []
          wait: []
          special: []
        images:
          step_image: "../../agents/test_images/step3.png"
          result_image: "../../agents/test_images/step3_1.png"
        template_matching:
          min_scale: 0.9
          max_scale: 1.1
          scale_step: 0.05
        element_text: "Find Full Text"
        on_success: "step_4_check_progress"
        on_failure: "step_2_click_references"
        expected_result: "Authenticate"
        timeout_sec: 120
        retry: -1

      - id: step_4_check_progress
        name: "步骤4：查看查找进度"
        description: "等待左侧边栏中的全文查找进度出现。"
        action:
          - "等待左侧边栏出现 Searching... 状态"
        actions: null
        images:
          step_image: null
          result_image: "../../agents/test_images/step4.png"
        element_text: null
        on_success: "done"
        expected_result: "Searching..."
        timeout_sec: 120
        retry: -1

      - id: done
        name: "完成：确认 Searching 状态稳定"
        description: "再次确认 FIND FULL TEXT 区域中的 Searching... 已稳定出现。"
        action:
          - "额外等待 2 秒后再次确认 Searching... 仍然可见"
        actions:
          wait:
            - timeout_sec: 2
        images:
          step_image: null
          result_image: "../../agents/test_images/step4.png"
        element_text: null
        expected_result: "Searching..."
        timeout_sec: 30
        retry: -1
